[project]
name = "pipeinit"
version = "0.1.0"
description = "CG/ゲームパイプライン向け命名規則・フォルダ構造自動化CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.7,<9",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mutmut>=3.3",
    "pytest>=9.0.3",
    "pytest-cov>=5.0,<6",
    "black>=24.0",
    "flake8>=7.1",
    "isort>=5.13",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-PyYAML",
]

[project.scripts]
pipeinit = "pipeinit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeinit*"]

[tool.setuptools.package-data]
pipeinit = ["data/*.yaml"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--cov=pipeinit --cov-report=term-missing"

[tool.mutmut]
source_paths = ["pipeinit/validator.py", "pipeinit/rules.py", "pipeinit/templates.py", "pipeinit/fsutil.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_validator.py",
    "tests/test_rules.py",
    "tests/test_rules_schema.py",
    "tests/test_templates.py",
    "tests/test_file_safety.py",
    "tests/test_properties.py",
]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
also_copy = ["pipeinit/"]
