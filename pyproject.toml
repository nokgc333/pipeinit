[project]
name = "pipeinit"
version = "0.2.0"
description = "CG/ゲームパイプライン向け命名規則・フォルダ構造自動化CLI(Houdini・Maya・Blender・Unreal)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "naokikaneko" }]
keywords = ["pipeline", "naming-convention", "vfx", "houdini", "maya", "blender", "unreal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.7,<9",
    "PyYAML>=6.0.2,<7",
]

[project.urls]
Homepage = "https://github.com/nokgc333/pipeinit"
Repository = "https://github.com/nokgc333/pipeinit"
Changelog = "https://github.com/nokgc333/pipeinit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mutmut>=3.3",
    "pytest>=9.0.3",
    "pytest-cov>=5.0,<8",
    "black>=24.0",
    "flake8>=7.1",
    "isort>=5.13",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-PyYAML",
    "build>=1.2",
    "twine>=5.1",
    "radon>=6.0",
]

[project.scripts]
pipeinit = "pipeinit.cli:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeinit*"]

[tool.setuptools.package-data]
pipeinit = ["data/*.yaml", "py.typed"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--cov=pipeinit --cov-report=term-missing"
testpaths = ["tests"]

[tool.mutmut]
source_paths = [
    "pipeinit/validator.py",
    "pipeinit/rules.py",
    "pipeinit/templates.py",
    "pipeinit/fsutil.py",
    "pipeinit/suggest.py",
    "pipeinit/config.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider", "--ignore=tests/test_cli_subprocess.py"]
also_copy = ["pipeinit/", ".pre-commit-hooks.yaml"]
